[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tuna-sdk"
dynamic = ["version"]
description = "Open tuna.am tunnels from Python code"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tuna.am authors", email = "info@tuna.am" }]
requires-python = ">=3.10"
dependencies = ["asyncssh>=2.24.1,<3"]
keywords = ["tunnel", "tuna", "ssh", "localhost", "webhook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://tuna.am"
Source = "https://github.com/yuccastream/tuna-sdk-python"

[dependency-groups]
dev = ["pytest>=9.2"]

[tool.hatch.version]
path = "tuna_sdk/_tunnel.py"
pattern = 'VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.sdist]
include = ["tuna_sdk", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["tuna_sdk"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
